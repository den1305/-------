<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>中文配音试听 · 5 个音色</title>
<style>
  :root { --ink:#1f2937; --line:#e5e7eb; --accent:#0f766e; }
  * { box-sizing: border-box; }
  body { margin:0; padding:32px 20px 60px; font-family: system-ui,-apple-system,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif; color:var(--ink); background:#f8fafc; }
  .wrap { max-width:760px; margin:0 auto; }
  h1 { font-size:22px; margin:0 0 6px; }
  p.sub { color:#64748b; margin:0 0 24px; font-size:14px; line-height:1.7; }
  .card { background:#fff; border:1px solid var(--line); border-radius:14px; padding:18px 20px; margin-bottom:14px; box-shadow:0 1px 2px rgba(15,23,42,.04); }
  .row { display:flex; align-items:center; gap:16px; flex-wrap:wrap; }
  .name { font-size:16px; font-weight:600; min-width:120px; }
  .name span { display:block; font-size:12px; font-weight:400; color:#94a3b8; margin-top:2px; }
  audio { flex:1 1 320px; min-width:260px; }
  .tip { font-size:13px; color:#64748b; background:#fff; border:1px dashed var(--line); border-radius:12px; padding:12px 16px; }
  code { background:#f1f5f9; padding:1px 6px; border-radius:5px; }
</style>
</head>
<body>
<div class="wrap">
  <h1>中文配音试听</h1>
  <p class="sub">
    同一句话，用当前中文模型（<code>sherpa-onnx-vits-zh-ll</code>，5 个音色）逐一朗读。<br>
    试听文案：「各位观众，欢迎参观世界文化遗产开平碉楼与村落。自力村碉楼群现存十五座碉楼，大多建于上世纪二三十年代。」
  </p>

  <div class="card">
    <div class="row"><div class="name">声音 1<span>sid = 0（当前默认）</span></div>
      <audio controls preload="none" src="_voices/sid0.mp3"></audio></div>
  </div>
  <div class="card">
    <div class="row"><div class="name">声音 2<span>sid = 1</span></div>
      <audio controls preload="none" src="_voices/sid1.mp3"></audio></div>
  </div>
  <div class="card">
    <div class="row"><div class="name">声音 3<span>sid = 2</span></div>
      <audio controls preload="none" src="_voices/sid2.mp3"></audio></div>
  </div>
  <div class="card">
    <div class="row"><div class="name">声音 4<span>sid = 3</span></div>
      <audio controls preload="none" src="_voices/sid3.mp3"></audio></div>
  </div>
  <div class="card">
    <div class="row"><div class="name">声音 5<span>sid = 4</span></div>
      <audio controls preload="none" src="_voices/sid4.mp3"></audio></div>
  </div>

  <p class="tip">听完后告诉我选哪一个（1–5）。如果都偏「口语」，我还可以：①整体降速到 0.9–0.95 让语气更稳重；②换用其他中文模型（如播音风格更强的音色）再试听。</p>
</div>
</body>
</html>
